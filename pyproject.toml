[project]
name = "delta"
version = "0.0.1-alpha"
description = "minimal personal coding agent"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.136.1",
    "ipython>=8.39.0",
    "langchain>=1.3.0",
    "langchain-community>=0.4.1",
    "langgraph>=1.2.0",
    "litellm>=1.84.0",
    "loguru>=0.7.3",
    "mcp>=1.27.1",
    "pydantic-settings>=2.14.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pyyaml>=6.0.3",
    "ruff>=0.15.13",
]

[tool.setuptools.packages.find]
where = ["src"]
