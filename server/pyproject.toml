[project]
name = "delta"
version = "0.0.1-alpha"
description = "personal research agent for literature survey and synthesis"
requires-python = ">=3.13"
dependencies = [
    "asyncpg>=0.31.0",
    "fastapi>=0.136.3",
    "langchain-litellm>=0.6.6",
    "langchain-text-splitters>=1.1.2",
    "langfuse>=4.7.1",
    "langgraph>=1.2.4",
    "langgraph-checkpoint-postgres>=3.1.0",
    "langmem>=0.0.30",
    "litellm>=1.87.1",
    "loguru>=0.7.3",
    "numpy>=2.4.6",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.30",
    "sse-starlette>=3.4.4",
    "transformers>=5.10.2",
    "uvicorn[standard]>=0.49.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/delta"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "pip>=26.1.2",
    "ipython>=9.14.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "pytest-env>=1.6.0",
    "respx>=0.23.1",
    "rich>=15.0.0",
]
