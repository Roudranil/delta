[project]
name = "delta"
version = "0.0.1-alpha"
description = "personal research agent for literature survey and synthesis"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.136.3",
    "langchain-text-splitters>=1.1.2",
    "langfuse>=4.7.1",
    "langgraph>=1.2.4",
    "langgraph-checkpoint-postgres>=3.1.0",
    "numpy>=2.4.6",
    "python-multipart>=0.0.30",
    "sse-starlette>=3.4.4",
    "uvicorn[standard]>=0.49.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/delta"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "ipython>=9.14.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "pytest-env>=1.6.0",
    "respx>=0.23.1",
]
