[project]
name = "delta"
version = "0.0.1-alpha"
description = "personal research agent for literature survey and synthesis"
requires-python = ">=3.13"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/delta"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
